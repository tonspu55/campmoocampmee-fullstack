packages:
  - '.'

# ข้าม lockfile supply-chain check ก่อนรัน script (pnpm dev/build)
# เพราะ lockfile verification ไม่สนใจ minimumReleaseAgeExclude ด้านล่าง
# ทำให้ pnpm dev พังทุกครั้งที่อัป Sanity เป็นเวอร์ชันที่ปล่อยไม่ถึง 24 ชม.
# policy ยังทำงานปกติตอน pnpm install
verifyDepsBeforeRun: false

allowBuilds:
  esbuild: false

ignoredBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - '@sanity/diff@5.31.0'
  - '@sanity/mutator@5.31.0'
  - '@sanity/schema@5.31.0'
  - '@sanity/types@5.31.0'
  - '@sanity/util@5.31.0'
  - '@sanity/vision@5.31.0'
  - sanity@5.31.0
  - '@sanity/cli-build@5.1.0'
  - '@sanity/cli-core@2.7.1'
  - '@sanity/cli@7.15.1'
  - '@sanity/diff@6.8.0'
  - '@sanity/mutator@6.8.0'
  - '@sanity/schema@6.8.0'
  - '@sanity/types@6.8.0'
  - '@sanity/util@6.8.0'
  - '@sanity/vision@6.8.0'
  - '@sanity/workbench-cli@1.8.0'
  - sanity@6.8.0
